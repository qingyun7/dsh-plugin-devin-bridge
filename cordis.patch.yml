# dsh-plugin-devin-bridge bundle patch
#
# 把 Devin Connect 注册为 dsh LLM 的 `devin` provider route，
# 让 dsh 内部的 agent loop 能使用 Devin 托管的模型。
#
# token 留空时自动从 Devin CLI 的 credentials.toml 读取（`devin auth login` 写入），
# 也可通过 dsh 设置面板动态配置。
#   models: 可选，默认包含 SWE-2 High 和 GLM-5.3 Max

- insert:
    - id: devin-bridge
      name: dsh-plugin-devin-bridge
      config:
        token: ""
        baseUrl: "https://server.codeium.com"
        proxy: ""
        forceHttp1: true
        defaultContextWindow: 128000
        defaultMaxTokens: 16384
        retryPolicy:
          mode: normal
          maxRetries: 3
          backoff:
            initialDelayMs: 500
            maxDelayMs: 10000
            jitterRatio: 0.1
